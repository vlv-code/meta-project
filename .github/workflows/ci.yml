name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'README.ru.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'CONTRIBUTING.ru.md'
  pull_request:
    branches: [main]
  # Manual dispatch is the ONLY trigger for the opt-in `claude-validate`
  # job; it never runs on push/PR and never blocks merge gating.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Skills & Templates Integrity
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
        include:
          # Windows coverage: single 3.12 leg (include adds a NEW combination
          # because `windows-latest` is absent from the os axis).
          - os: windows-latest
            python-version: '3.12'

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # ── Trusted-base boundary enforcement (audit §2) ────────────────────
      # The checker code and the boundaries policy are ALWAYS taken from a
      # trusted base revision, so policy changes inside a PR can never
      # determine the admissibility of that same PR (no self-certification).
      - name: Determine trusted base revision
        id: trusted_base
        if: ${{ hashFiles('.agents/project_knowledge/boundaries.md') != '' }}
        shell: bash
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Pin the merge-base of the PR head and its base branch tip:
            # the PR cannot substitute or move its own comparison base.
            BASE_SHA="$(git merge-base \
              "${{ github.event.pull_request.head.sha }}" \
              "origin/${{ github.base_ref }}")"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              # Zero/absent 'before' (branch creation or rewritten history):
              # no trusted prior revision exists to diff against. Fail
              # explicitly instead of substituting HEAD~1. Bootstrap: push
              # one more commit to establish a verifiable base, or verify
              # the change manually with maintainer review.
              echo "::error::No trusted base revision available (zero github.event.before). Refusing to self-certify."
              exit 1
            fi
            BASE_SHA="$BEFORE"
          fi
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "Trusted base revision: $BASE_SHA"

      - name: Materialize trusted gate and policy from base revision
        # Distribution branches (framework content only) carry no boundary
        # policy: the trusted-base gate is a dogfood-branch contract.
        if: ${{ hashFiles('.agents/project_knowledge/boundaries.md') != '' }}
        shell: bash
        run: |
          set -eu
          BASE_SHA="${{ steps.trusted_base.outputs.sha }}"
          mkdir -p /tmp/trusted_gate
          git show "$BASE_SHA:scripts/check_boundaries.py" > /tmp/trusted_gate/check_boundaries.py
          # ADR #22: the gate imports its shared-helper requires companion —
          # a subset deployment must ship scripts/_common.py alongside it.
          git show "$BASE_SHA:scripts/_common.py" > /tmp/trusted_gate/_common.py
          git show "$BASE_SHA:.agents/project_knowledge/boundaries.md" > /tmp/trusted_gate/boundaries.md
          echo "Enforcing with gate and policy from trusted base $BASE_SHA"

      - name: Boundary Gate audit-tree (trusted policy over incoming tree)
        if: ${{ hashFiles('.agents/project_knowledge/boundaries.md') != '' }}
        shell: bash
        run: |
          set -eu
          python /tmp/trusted_gate/check_boundaries.py \
            --boundaries /tmp/trusted_gate/boundaries.md \
            --audit-tree \
            --repo-root .

      - name: Evaluate change diff against trusted base
        if: ${{ hashFiles('.agents/project_knowledge/boundaries.md') != '' }}
        shell: bash
        run: |
          set -eu
          BASE_SHA="${{ steps.trusted_base.outputs.sha }}"
          # Wave H: SHA-bound maintainer sanction. The sanction file is carried
          # by the incoming push and verified against THIS base revision, so a
          # new push invalidates older sanctions. The push actor (GitHub-level,
          # not forgeable inside Actions) must match the authorized maintainer.
          python /tmp/trusted_gate/check_boundaries.py \
            --boundaries /tmp/trusted_gate/boundaries.md \
            --diff "$BASE_SHA" \
            --repo-root . \
            --sanction-file .github/red-zone-sanction.json \
            --sanction-base-sha "$BASE_SHA" \
            --sanction-actor "${{ github.actor }}"
      # ─────────────────────────────────────────────────────────────────────

      - name: Verify Template Parity
        run: python scripts/sync_templates.py --check

      - name: Run integrity tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      # Declared opt-in CI dev-tool (Default Closed Tooling exception):
      # zero runtime dependencies unchanged — pyflakes is a dev-time linter,
      # pinned to the exact version, never @latest.
      - name: "Static lint: pyflakes (scripts/ + tests/)"
        run: |
          python -m pip install pyflakes==4.1.0
          python -m pyflakes scripts/ tests/

      # External dev-tool validation (auditor v2 §2.4): the Agent Skills
      # reference validator (`skills-ref validate`, one call per skill
      # directory — its real CLI has no `check --strict`). External dev-tool;
      # non-blocking until the alpha.7 validator decision.
      - name: External skills-ref validation (non-blocking)
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        continue-on-error: true
        shell: bash
        run: |
          set -eu
          # pin: bump deliberately (skills-ref@0.1.5 — npm "Reference library
          # for Agent Skills"; exact pin, never @latest).
          for skill_dir in ./skills/*/; do
            npx --yes skills-ref@0.1.5 validate "$skill_dir"
          done

      - name: Verify installation identity (verify_identity --check)
        if: ${{ hashFiles('.agents/meta-project.json') != '' }}
        run: python scripts/verify_identity.py --check

      # Machine-check of the documented update-engine `check` rc contract on
      # synthetic repos (zero writes into this repo; stdlib-only):
      #   rc 0 = up-to-date (target matches the pinned upstream revision)
      #   rc 1 = updates found (upstream advanced past the installed content)
      # Asserts the rc contract ONLY — it must not depend on any JSON field
      # that a concurrent engine lane may add (no cross-lane timing coupling).
      - name: "Smoke: update-engine check rc contract (synthetic repos)"
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        shell: bash
        run: |
          set -eu
          python - <<'PY'
          import hashlib, json, os, subprocess, sys, tempfile
          from pathlib import Path

          engine = Path("scripts/update_meta_project.py").resolve()
          tmp = Path(tempfile.mkdtemp(prefix="rc-smoke-"))
          env_git = {
              **os.environ,
              "GIT_AUTHOR_NAME": "ci-smoke",
              "GIT_AUTHOR_EMAIL": "ci-smoke@meta-project.invalid",
              "GIT_COMMITTER_NAME": "ci-smoke",
              "GIT_COMMITTER_EMAIL": "ci-smoke@meta-project.invalid",
          }

          def git(cwd, *args):
              res = subprocess.run(
                  ["git", *args], cwd=str(cwd), capture_output=True, text=True,
                  env=env_git,
              )
              if res.returncode != 0:
                  raise SystemExit(
                      f"smoke fixture git {' '.join(args)} failed: {res.stderr}"
                  )
              return res.stdout.strip()

          manifest = {
              "schema_version": "1.0.0",
              "framework_version": "1.0.0-smoke.1",
              "channel": "preview",
              "components": [
                  {"path": "scripts/hello.py", "kind": "script", "requires": []},
              ],
              "migrations": [],
          }

          # Origin upstream: two commits on main; HEAD (main) drifts ahead of
          # the first commit, whose SHA stays available for exact pinning.
          origin = tmp / "origin-repo"
          origin.mkdir()
          git(origin, "init", "-q", "-b", "main")
          (origin / "manifest.json").write_text(
              json.dumps(manifest, indent=2), encoding="utf-8"
          )
          hello_v1 = b'VALUE = "hello-v1"\n'
          hello_v2 = b'VALUE = "hello-v2"\n'
          (origin / "scripts").mkdir()
          (origin / "scripts" / "hello.py").write_bytes(hello_v1)
          git(origin, "add", "-A")
          git(origin, "commit", "-qm", "c1: hello v1")
          pinned_sha = git(origin, "rev-parse", "HEAD")
          (origin / "scripts" / "hello.py").write_bytes(hello_v2)
          git(origin, "add", "-A")
          git(origin, "commit", "-qm", "c2: upstream drift v2")

          # Consumer target: committed install of the upstream v1 content.
          # The lock records the installed subset (the engine's check
          # diagnoses lock-recorded components only).
          target = tmp / "target-app"
          (target / "scripts").mkdir(parents=True)
          (target / "manifest.json").write_text(
              json.dumps(manifest, indent=2), encoding="utf-8"
          )
          (target / "scripts" / "hello.py").write_bytes(hello_v1)
          (target / ".agents").mkdir()
          (target / ".agents" / "framework-lock.json").write_text(
              json.dumps({
                  "schema_version": "1.0.0",
                  "source": {
                      "repository": str(origin),
                      "ref": "main",
                      "commit_sha": pinned_sha,
                      "origin": "upstream",
                      "channel": "preview",
                  },
                  "components": [
                      {
                          "path": "scripts/hello.py",
                          "kind": "script",
                          "installed_sha256": hashlib.sha256(hello_v1).hexdigest(),
                      },
                  ],
                  "installed_at": "2026-11-16T00:00:00Z",
              }, indent=2),
              encoding="utf-8",
          )
          git(target, "init", "-q", "-b", "main")
          git(target, "add", "-A")
          git(target, "commit", "-qm", "target: installed v1")

          def check(ref):
              return subprocess.run(
                  [sys.executable, str(engine), "check",
                   "--repo-root", str(target), "--source", str(origin),
                   "--ref", ref],
                  capture_output=True, text=True,
              )

          up_to_date = check(pinned_sha)
          if up_to_date.returncode != 0:
              raise SystemExit(
                  "rc-contract smoke FAILED: expected rc 0 (up-to-date) for a "
                  f"target matching the pinned upstream SHA, got "
                  f"rc={up_to_date.returncode}\n"
                  f"stdout: {up_to_date.stdout}\nstderr: {up_to_date.stderr}"
              )

          updates_found = check("main")
          if updates_found.returncode != 1:
              raise SystemExit(
                  "rc-contract smoke FAILED: expected rc 1 (updates-found) "
                  f"after upstream drift, got rc={updates_found.returncode}\n"
                  f"stdout: {updates_found.stdout}\nstderr: {updates_found.stderr}"
              )

          print(
              "rc-contract smoke OK: pinned-SHA check rc=0 (up-to-date); "
              "drifted-origin check rc=1 (updates-found)"
          )
          PY

  # Stable aggregate for Branch Protection "required status checks": wire this
  # single job name instead of enumerating matrix legs. It is green ONLY when
  # ALL expanded validate legs succeed, i.e. the check names
  #   Validate Skills & Templates Integrity (3.10, ubuntu-latest)
  #   Validate Skills & Templates Integrity (3.11, ubuntu-latest)
  #   Validate Skills & Templates Integrity (3.12, ubuntu-latest)
  #   Validate Skills & Templates Integrity (3.13, ubuntu-latest)
  #   Validate Skills & Templates Integrity (3.12, windows-latest)
  # including the rc-contract smoke and identity steps they carry.
  all-checks:
    name: All Checks Green
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [validate]
    if: ${{ always() }}
    steps:
      - name: Aggregate gate over all matrix legs
        shell: bash
        run: |
          set -eu
          result="${{ needs.validate.result }}"
          echo "validate matrix aggregate result: $result"
          if [ "$result" != "success" ]; then
            echo "::error::Not all validate legs succeeded (aggregate result: $result)."
            exit 1
          fi
          echo "All Checks Green: every validate leg succeeded."

  # Opt-in manual validation of the Claude Code plugin manifests. Triggered
  # ONLY via workflow_dispatch (see the `on:` block) and not part of the
  # `all-checks` aggregate, so it can never block push/PR gating.
  # Requires Claude Code CLI on the runner; manual validation until proven.
  claude-validate:
    name: Claude Plugin Validate (manual, opt-in)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate plugin manifests (Claude Code CLI)
        shell: bash
        run: |
          set -eu
          claude plugin validate --strict .
